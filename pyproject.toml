[project]
name = "base-comfyui-node"
description = "A custom [ComfyUI](https://github.com/comfyanonymous/ComfyUI) node that lets you upload generated media directly to your [BASE](https://getbase.app) account — no manual downloads or re-uploads needed."
version = "1.1.3"
license = {file = "LICENSE"}
dependencies = [
    "requests",
    "Pillow",
    "torch",
    "numpy"
]

[project.urls]
Repository = "https://github.com/babe-and-spencer-enterprises/base-comfyui-node"
#  Used by Comfy Registry https://comfyregistry.org

[tool.comfy]
PublisherId = "base"
DisplayName = "base-comfyui-node"
Icon = "https://go.getbase.app/logo.png"
